<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interactiva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <!-- Encabezado / Título -->
        <header class="calculator-header">
            <div class="header-indicator">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <h1>Calculadora</h1>
        </header>

        <!-- Pantalla de visualización -->
        <section class="display-container">
            <div id="formula" class="formula-screen"></div>
            <div id="display" class="current-screen">0</div>
        </section>

        <!-- Teclado de botones -->
        <main class="buttons-grid">
            <!-- Fila 1 -->
            <button id="clear" class="btn btn-function" data-action="clear">AC</button>
            <button id="delete" class="btn btn-function" data-action="delete" title="Borrar último dígito">⌫</button>
            <button id="percent" class="btn btn-function" data-action="percent">%</button>
            <button id="divide" class="btn btn-operator" data-action="operator" data-value="/">÷</button>

            <!-- Fila 2 -->
            <button id="seven" class="btn btn-number" data-value="7">7</button>
            <button id="eight" class="btn btn-number" data-value="8">8</button>
            <button id="nine" class="btn btn-number" data-value="9">9</button>
            <button id="multiply" class="btn btn-operator" data-action="operator" data-value="*">×</button>

            <!-- Fila 3 -->
            <button id="four" class="btn btn-number" data-value="4">4</button>
            <button id="five" class="btn btn-number" data-value="5">5</button>
            <button id="six" class="btn btn-number" data-value="6">6</button>
            <button id="subtract" class="btn btn-operator" data-action="operator" data-value="-">−</button>

            <!-- Fila 4 -->
            <button id="one" class="btn btn-number" data-value="1">1</button>
            <button id="two" class="btn btn-number" data-value="2">2</button>
            <button id="three" class="btn btn-number" data-value="3">3</button>
            <button id="add" class="btn btn-operator" data-action="operator" data-value="+">+</button>

            <!-- Fila 5 -->
            <button id="toggle-sign" class="btn btn-number" data-action="toggle-sign">±</button>
            <button id="zero" class="btn btn-number" data-value="0">0</button>
            <button id="decimal" class="btn btn-number" data-value=".">.</button>
            <button id="equals" class="btn btn-equals" data-action="equals">=</button>
        </main>
        
        <footer class="calculator-footer">
            <p>Soporta uso con teclado físico</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
